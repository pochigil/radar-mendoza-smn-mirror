name: SMN probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Public IP of this runner
        run: curl -s https://api.ipify.org; echo
      - name: Download the index and a few CAP files
        run: |
          ua="radar-mendoza-api probe"
          code=$(curl -s -A "$ua" -o index.xml -w '%{http_code}' https://ssl.smn.gob.ar/CAP/AR.php)
          echo "index: $code $(wc -c < index.xml) bytes"
          code=$(curl -s -A "$ua" -o st.xml -w '%{http_code}' https://ssl.smn.gob.ar/feeds/CAP/avisocortoplazo/rss_acpCAP.xml)
          echo "short-term RSS: $code $(head -c 80 st.xml | tr '\n' ' ')"
          grep -o 'https://ssl.smn.gob.ar/feeds/CAP/xml_generados/[^<]*\.xml' index.xml | sort -u | head -10 > urls.txt
          for u in $(cat urls.txt); do
            code=$(curl -s -A "$ua" -o f.xml -w '%{http_code}' "$u")
            echo "$code $(head -c 60 f.xml | tr '\n' ' ') $(basename "$u")"
            sleep 1
          done
